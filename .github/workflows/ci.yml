# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    # Docs-only changes start no CI run (docs get push, merge and publish only).
    paths-ignore: ['**.md', '**.mdx', '**.rst', '**.docx', '**.pdf', '**/LICENSE', '**/LICENSE.*', '**/NOTICE', '**/NOTICE.*', 'docs/**.png', 'docs/**.jpg', 'docs/**.svg', 'docs/**.gif', 'docs/**.webp', 'docs/**.html', 'docs/**.css']
    branches: [ main ]
  pull_request:
    # Docs-only changes start no CI run (docs get push, merge and publish only).
    paths-ignore: ['**.md', '**.mdx', '**.rst', '**.docx', '**.pdf', '**/LICENSE', '**/LICENSE.*', '**/NOTICE', '**/NOTICE.*', 'docs/**.png', 'docs/**.jpg', 'docs/**.svg', 'docs/**.gif', 'docs/**.webp', 'docs/**.html', 'docs/**.css']
  workflow_dispatch:

jobs:
  render:
    name: Render proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
          openscad --version

      - name: Full render proof (split fast cells + examples + negative asserts + mesh checks)
        shell: pwsh
        run: |
          & ./scripts/render_proof.ps1 -OpenSCAD openscad -OutDir proof/ci

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-proof-output
          path: proof/ci
          if-no-files-found: ignore
